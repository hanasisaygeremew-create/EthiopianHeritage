<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ethiopian Heritage</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .admin-login {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: #f8f5ed;
            border-radius: 12px;
        }

        .admin-login h1 {
            color: #183c2b;
            text-align: center;
        }

        .admin-login label {
            display: block;
            margin: 16px 0 8px;
        }

        .admin-login input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
        }

        .admin-login button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #183c2b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-error {
            color: #a12626;
        }
    </style>
</head>
<body>
    <main class="admin-login">
        <h1>Admin Login</h1>
        <p>Sign in to view contact messages.</p>

        {% if error %}
            <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <label for="password">Admin Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Log In</button>
            <a href="{{ url_for('home') }}" class="back-home-link">
                ← Back to Home
            </a>
        </form>
    </main>
</body>
</html>
